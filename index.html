<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website CRUD Simple</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f9f9f9; }
    .card { max-width: 500px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    button { background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn-danger { background: #e00; }
    .btn-warning { background: #f5a623; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
  </style>
</head>
<body>

<div class="card">
  <h2>Aplikasi CRUD</h2>
  <input type="hidden" id="idData">
  <input type="text" id="nama" placeholder="Nama Lengkap">
  <input type="email" id="email" placeholder="Email">
  <button id="btnSimpan" onclick="simpanData()">Simpan Data</button>
  <button id="btnBatal" onclick="resetForm()" style="display:none; background:#666;">Batal</button>

  <h3>Data Tersimpan</h3>
  <table>
    <thead>
      <tr><th>Nama</th><th>Email</th><th>Aksi</th></tr>
    </thead>
    <tbody id="tabelData"><tr><td colspan="3">Memuat...</td></tr></tbody>
  </table>
</div>

<script>
  // MASUKKAN URL GOOGLE APPS SCRIPT MILIKMU DI BAWAH INI
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwS6FkKDj0TTKQ4ZOTyjVtrtLgAv8kFbsGzwQVXvXX7_wnfnd-kgbxLukOF6I2TdVgPag/exec";

function ambilData() {
    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        let html = "";
        
        data.forEach(row => {
          let keys = Object.keys(row);
          
          let idVal = row.id || row.Id || row.ID || (keys[0] ? row[keys[0]] : "");
          let namaVal = row.nama || row.Nama || row.NAMA || (keys[1] ? row[keys[1]] : "");
          let emailVal = row.email || row.Email || row.EMAIL || (keys[2] ? row[keys[2]] : "");

          html += `
            <tr>
              <td>${namaVal}</td>
              <td>${emailVal}</td>
              <td>
                <button class="btn-warning" onclick="editData('${idVal}', '${namaVal}', '${emailVal}')">Edit</button>
                <button class="btn-danger" onclick="hapusData('${idVal}')">Hapus</button>
              </td>
            </tr>`;
        });

        document.getElementById("tabelData").innerHTML = html || "<tr><td colspan='3'>Kosong</td></tr>";
      })
      .catch(err => {
        console.error("Error:", err);
        document.getElementById("tabelData").innerHTML = "<tr><td colspan='3'>Gagal memuat data</td></tr>";
      });
  }

  function simpanData() {
    const id = document.getElementById("idData").value;
    const nama = document.getElementById("nama").value;
    const email = document.getElementById("email").value;

    if (!nama || !email) return alert("Semua kolom wajib diisi!");

    const action = id ? "update" : "create";
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: action, id: id, nama: nama, email: email })
    })
    .then(res => res.json())
    .then(res => {
      alert(res.message);
      resetForm();
      ambilData();
    });
  }

  function editData(id, nama, email) {
    document.getElementById("idData").value = id;
    document.getElementById("nama").value = nama;
    document.getElementById("email").value = email;
    document.getElementById("btnSimpan").innerText = "Update Data";
    document.getElementById("btnBatal").style.display = "block";
  }

  function hapusData(id) {
    if (confirm("Hapus data ini?")) {
      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "delete", id: id })
      })
      .then(res => res.json())
      .then(res => {
        alert(res.message);
        ambilData();
      });
    }
  }

  function resetForm() {
    document.getElementById("idData").value = "";
    document.getElementById("nama").value = "";
    document.getElementById("email").value = "";
    document.getElementById("btnSimpan").innerText = "Simpan Data";
    document.getElementById("btnBatal").style.display = "none";
  }

  ambilData();
</script>
</body>
</html>
